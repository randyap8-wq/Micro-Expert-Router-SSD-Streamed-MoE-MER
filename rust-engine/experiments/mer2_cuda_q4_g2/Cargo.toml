[package]
name = "mer2-cuda-q4-g2"
version = "0.1.0"
edition = "2021"
publish = false

# Keep resolution, tests and the lockfile independent of production MER.
[workspace]

[features]
default = []
cuda = ["dep:candle-kernels", "dep:cudarc"]

[dependencies]
mer2-cuda-q4-s2 = { path = "../mer2_cuda_q4_s2", default-features = false }
serde_json = "=1.0.149"
candle-kernels = { version = "=0.10.2", path = "../../vendor/candle-kernels", optional = true }
cudarc = { version = "=0.19.7", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-version-from-build-system"], optional = true }
